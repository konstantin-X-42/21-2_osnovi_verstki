<!doctype html>
<html lang="ru">
<head>
    <meta charset="UTF-8" /> <!-- Кодировка страницы -->
    <title>Заголовок страницы</title> <!-- Заголовок -->
    <link href="style.css" rel="stylesheet" />
</head>
<body> <!-- Тело страницы -->
    <h1 class="center-items">Заголовок на странице</h1> <!-- Заголовок на странице -->
    <div class="center-items"> <!-- Ссылка -->
        <a href="https://sky.pro">Мой личный кабинет</a>
    </div>
    <div class="center-items">
    <!-- Изображение https://variety.com/wp-content/uploads/2021/07/Rick-Astley-Never-Gonna-Give-You-Up.png -->
    <img src="https://variety.com/wp-content/uploads/2021/07/Rick-Astley-Never-Gonna-Give-You-Up.png"/>
</div>
<div class="center-items"> <!-- Форма со сбором имени и почты -->
    <form method="post">
        <input type="text" name="name" placeholder="Иван Иванов"/>
        <input type="email" name="email" placeholder="email@example.com"/>
        <button type="submit">Отправить</button> <!-- Кнопка отправки формы -->
    </form>
</div>

<!-- Список с перечислением -->
<ul class="center-items">
    <li>Первый</li>
    <li>Второй</li>
    <li>Третий</li>
</ul>
<!-- Таблица с данными -->
<table>
    <tr>
        <th>Столбец 1</th>
        <th>Столбец 2</th>
    </tr>
    <tr>
        <td>Данные 1</td>
        <td>Данные 2</td>
    </tr>
    <tr>
        <td>Данные 3</td>
        <td>Данные 4</td>
    </tr>
</table>
</body>
</html>
